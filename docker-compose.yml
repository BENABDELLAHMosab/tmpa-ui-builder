version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: tmpa_mongo
    command: ["--replSet", "rs0"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  mongo-init:
    image: mongo:latest
    depends_on:
      - mongo
    restart: "no"
    command: >
      mongosh --host mongo --eval '
      try { 
        var st = rs.status(); 
        print("Replica set status OK"); 
      } catch(e) { 
        print("Initializing replica set..."); 
        rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); 
      }'

  mongo-express:
    image: mongo-express:1.0.2
    container_name: tmpa-ui-builder-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - mongo
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tmpa_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/tmpa_ui_builder?replicaSet=rs0
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tmpa_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:

name: tmpa-ui-builder

services:
  mongo-key-init:
    image: alpine:3.21
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      if [ ! -s /keys/mongo-keyfile ]; then
        umask 077
        head -c 756 /dev/urandom | base64 | tr -d '\n' > /keys/mongo-keyfile
        chown 999:999 /keys/mongo-keyfile
        chmod 400 /keys/mongo-keyfile
      fi
    volumes:
      - mongo_key:/keys
    networks:
      - database

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/run/mongo-key/mongo-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: tmpa_ui_builder
      MONGO_APP_USERNAME: tmpa_app
    secrets:
      - mongo_root_password
      - mongo_app_password
    volumes:
      - mongo_data:/data/db
      - mongo_key:/run/mongo-key:ro
      - ./deploy/mongo/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
      - ./deploy/mongo/init-app-user.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
    depends_on:
      mongo-key-init:
        condition: service_completed_successfully
    networks:
      - database

  mongo-init:
    image: mongo:8.0
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/init-replica.sh"]
    secrets:
      - mongo_root_password
    volumes:
      - ./deploy/mongo/init-replica.sh:/scripts/init-replica.sh:ro
    depends_on:
      mongo:
        condition: service_started
    networks:
      - database

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      CORS_ORIGIN: https://${DOMAIN:?Définir DOMAIN dans .env.vps}
    secrets:
      - mongo_app_password
      - jwt_secret
    expose:
      - "5000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks:
      - database
      - application

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - application

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - application

  certbot:
    image: certbot/certbot:latest
    profiles: ["maintenance"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot

secrets:
  mongo_root_password:
    file: ./deploy/secrets/mongo-root-password
  mongo_app_password:
    file: ./deploy/secrets/mongo-app-password
  jwt_secret:
    file: ./deploy/secrets/jwt-secret

volumes:
  mongo_data:
  mongo_key:
  letsencrypt:
  certbot_www:

networks:
  database:
    internal: true
  application:
